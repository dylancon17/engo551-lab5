<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

        
        <!-- From https://leafletjs.com/examples/quick-start/-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

        <!-- From D2L -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    


        <link rel="stylesheet" href="style.css">

        <title>Dylan's Temperature Recorder</title>

    </head>    
    <body>
        <nav class="navbar navbar-expand navbar-light bg-light">
            <a class="navbar-brand" href="#">Dylan's Temperature Recorder - 5</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </nav>        
        
        <div class="container info-section">
            <div class="row">
                <div class="col text-center">
                        <input id="host" name="host" type="text" value="test.mosquitto.org" title="Host">
                        <input id="port" name="port" type="number" value="8081" title="Port">
                        <input id="topic" name="topic" type="text" value="engo551/dylan_conley/my_temperature" size="40" title="Topic">
                </div>
            </div>
            <div class="row">
                <div class="col text-center">
                    <button onclick="startconnection(event)">Start</button>
                </div>
                <div class="col text-center">
                    <button onclick="endConnection(event)">End</button>
                </div>
                <div class="col text-center">
                    <button onclick="settopic(event)">Set Topic</button>
                </div>
                <div class="col text-center">
                    <button onclick="publishstatus(event)">Share My Status</button>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div id="map"></div>
                </div>
            </div>

        </div>

        <script src="map.js"></script>
